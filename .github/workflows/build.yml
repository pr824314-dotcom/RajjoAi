name: Build Rajjo AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Rajjo AI project
        run: |
          mkdir project
          unzip -q RajjoAI_Android_Project-1.zip -d project

      - name: Fix JVM target
        working-directory: project/RajjoAI_Android_Project
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          s = p.read_text()

          if "compileOptions" not in s:
              s = s.replace(
                  "android {",
                  """android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }"""
              )

          p.write_text(s)
          PY

      - name: Build APK
        working-directory: project/RajjoAI_Android_Project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rajjo-AI-debug-APK
          path: project/RajjoAI_Android_Project/app/build/outputs/apk/debug/app-debug.apk
